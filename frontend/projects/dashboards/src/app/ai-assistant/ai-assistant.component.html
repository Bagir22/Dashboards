<div class="ai-assistant">
  <div class="ai-header">
    <div class="header-left">
      <h3>ИИ-помощник</h3>
      <span class="dashboard-indicator" *ngIf="currentDashboardName" [title]="'Анализ дашборда: ' + currentDashboardName">
        📊 {{ currentDashboardName }}
      </span>
    </div>
    <div class="header-right">
      <button 
        *ngIf="isLoading" 
        class="cancel-btn" 
        (click)="cancelRequest()" 
        title="Отменить запрос">
        <span class="cancel-icon">⏹️</span>
        <span class="cancel-text">Отмена</span>
      </button>
      <button 
        class="close-btn" 
        (click)="close.emit()" 
        *ngIf="!isLoading" 
        title="Закрыть">
        ✕
      </button>
    </div>
  </div>
  
  <div class="messages-container" #messagesContainer>
    <div *ngFor="let msg of messages" class="message" [class.user-message]="msg.isUser">
      <div class="message-content-wrapper">
        <div class="message-content">{{ msg.text }}</div>
        <div class="message-time">{{ msg.timestamp | date:'HH:mm' }}</div>
      </div>
    </div>
    
    <div *ngIf="isLoading && !currentStreamingMessage" class="loading-indicator">
      <tui-loader size="s" [inheritColor]="false"></tui-loader>
      <span>Подготовка к анализу...</span>
    </div>
    
    <div *ngIf="isLoading && currentStreamingMessage" class="streaming-indicator">
      <span class="typing-indicator">⚡</span>
    </div>
  </div>

  <div class="actions-grid">
    <button
      *ngFor="let action of actions"
      class="action-btn"
      [class.primary]="action.primary"
      [disabled]="isLoading"
      (click)="executeAction(action)">
      <span class="action-icon">{{ action.icon }}</span>
      <span class="action-text">{{ action.text }}</span>
    </button>
  </div>
</div>
